<!DOCTYPE html>
<html>
<head>
  <title>Deposit Test</title>
  <style>
    body { font-family: monospace; background: #0f0f14; color: white; padding: 40px; max-width: 600px; }
    button { background: #6eb5ff; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: bold; margin: 8px 4px; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    #log { background: #1a1a2e; padding: 16px; border-radius: 8px; margin-top: 16px; min-height: 200px; white-space: pre-wrap; font-size: 12px; line-height: 1.6; }
    .ok  { color: #6bbf7a; }
    .err { color: #f4845f; }
    .info{ color: #6eb5ff; }
    input { background: #1a1a2e; border: 1px solid #333; color: white; padding: 10px; border-radius: 6px; font-size: 14px; width: 120px; }
  </style>
</head>
<body>

<h2>🧪 Raw Deposit Test</h2>
<p style="color:#aaa;font-size:13px">Bypasses React/ethers entirely. Calls MetaMask directly via window.ethereum.</p>

<div style="margin-bottom:16px">
  <label style="color:#aaa;font-size:12px;display:block;margin-bottom:6px">AMOUNT (mUSDC)</label>
  <input type="number" id="amount" value="1" min="0.000001" step="0.1" />
</div>

<button id="btnConnect">1. Connect Wallet</button>
<button id="btnApprove" disabled>2. Approve</button>
<button id="btnDeposit" disabled>3. Deposit</button>
<button id="btnBoth"    disabled>2+3. Approve + Deposit</button>

<div id="log">Waiting...</div>

<script>
  const TOKEN = '0xe55fF5f4df166F68A5aE8f2Ddf6290cD7BCAf9F2'
  const VAULT = '0x41e56f27F73D7ED7cB18c9c83115C9CfE9E91E18'

  let account = null
  let eth = null
  const log = document.getElementById('log')

  function print(msg, cls = '') {
    const ts = new Date().toLocaleTimeString()
    log.innerHTML += `<span class="${cls}">[${ts}] ${msg}\n</span>`
    log.scrollTop = log.scrollHeight
  }
  function clear() { log.innerHTML = '' }

  function getEth() { return eth || window.ethereum }

  async function waitReceipt(txHash) {
    print(`  polling receipt for ${txHash.slice(0,10)}...`, 'info')
    for (let i = 0; i < 120; i++) {
      const r = await getEth().request({ method: 'eth_getTransactionReceipt', params: [txHash] })
      if (r) {
        if (r.status === '0x0') throw new Error('tx reverted on-chain')
        return r
      }
      await new Promise(res => setTimeout(res, 2000))
    }
    throw new Error('receipt timeout')
  }

  async function sendTx(params) {
    try {
      const txHash = await getEth().request({ method: 'eth_sendTransaction', params: [params] })
      print(`  tx hash: ${txHash}`, 'ok')
      return txHash
    } catch(e) {
      if (e.code === 4100) {
        print(`  4100 thrown but popup shown — waiting for user to confirm in MetaMask...`, 'info')
        const nonceBefore = await getEth().request({ method: 'eth_getTransactionCount', params: [params.from, 'latest'] })
        const nonceNum = parseInt(nonceBefore, 16)
        print(`  nonce before: ${nonceNum} — polling for increment...`, 'info')
        for (let i = 0; i < 120; i++) {
          await new Promise(r => setTimeout(r, 2000))
          const nonceNow = parseInt(await getEth().request({ method: 'eth_getTransactionCount', params: [params.from, 'latest'] }), 16)
          if (nonceNow > nonceNum) {
            print(`  nonce incremented to ${nonceNow} — tx confirmed!`, 'ok')
            return null
          }
        }
        throw new Error('timed out waiting for nonce increment after 4100')
      }
      if (e.code === 4001) throw new Error('user rejected')
      throw e
    }
  }

  // Wait for MetaMask to inject window.ethereum
  async function getEthereum() {
    if (window.ethereum) return window.ethereum
    return new Promise(resolve => {
      window.addEventListener('ethereum#initialized', () => resolve(window.ethereum), { once: true })
      setTimeout(() => resolve(window.ethereum), 3000)
    })
  }

  getEthereum().then(async e => {
    eth = e
    if (!eth) { print('MetaMask not found!', 'err'); return }
    const accounts = await eth.request({ method: 'eth_accounts' })
    if (accounts.length) {
      account = accounts[0]
      print(`auto-connected: ${account}`, 'ok')
      document.getElementById('btnApprove').disabled = false
      document.getElementById('btnDeposit').disabled = false
      document.getElementById('btnBoth').disabled = false
    } else {
      print('not connected — click Connect Wallet', 'info')
    }
  })

  document.getElementById('btnConnect').onclick = async () => {
    clear()
    try {
      // Try eth_accounts first (no popup, no -32002 risk)
      let accounts = await getEth().request({ method: 'eth_accounts' })
      if (!accounts.length) {
        print('no pre-existing permission — calling eth_requestAccounts...', 'info')
        print('approve the MetaMask popup if it appears', 'info')
        // Retry loop: if -32002 fires (another pending request), wait 2s and retry
        for (let attempt = 0; attempt < 10; attempt++) {
          try {
            accounts = await getEth().request({ method: 'eth_requestAccounts' })
            break
          } catch(e2) {
            if (e2.code === -32002) {
              print(`  MetaMask busy (attempt ${attempt+1}/10), retrying in 2s...`, 'info')
              print('  → check MetaMask for any pending popup and approve or reject it', 'info')
              await new Promise(r => setTimeout(r, 2000))
            } else {
              throw e2
            }
          }
        }
      }
      if (!accounts || !accounts.length) {
        print('still no accounts after retries — check MetaMask', 'err')
        return
      }
      account = accounts[0]
      print(`connected: ${account}`, 'ok')
      document.getElementById('btnApprove').disabled = false
      document.getElementById('btnDeposit').disabled = false
      document.getElementById('btnBoth').disabled = false
    } catch(e) {
      print(`connect error: ${e.message} (code ${e.code})`, 'err')
    }
  }

  document.getElementById('btnApprove').onclick = async () => {
    clear()
    const amt = Number(document.getElementById('amount').value)
    if (!amt || !account) return
    const raw = BigInt(Math.floor(amt * 1_000_000))
    const data = '0x095ea7b3'
      + VAULT.slice(2).toLowerCase().padStart(64, '0')
      + raw.toString(16).padStart(64, '0')

    try {
      print(`approve ${amt} mUSDC (${raw} raw)`, 'info')
      print(`  from: ${account}`, 'info')
      print(`  to:   ${TOKEN}`, 'info')
      print(`  data: ${data.slice(0,20)}...`, 'info')
      const txHash = await getEth().request({
        method: 'eth_sendTransaction',
        params: [{ from: account, to: TOKEN, data, gas: '0x186a0' }]
      })
      print(`approve tx sent: ${txHash}`, 'ok')
      const r = await waitReceipt(txHash)
      print(`approve CONFIRMED in block ${parseInt(r.blockNumber, 16)}`, 'ok')
    } catch(e) {
      print(`approve error: ${e.message} (code ${e.code})`, 'err')
      console.error(e)
    }
  }

  document.getElementById('btnDeposit').onclick = async () => {
    clear()
    const amt = Number(document.getElementById('amount').value)
    if (!amt || !account) return
    const raw = BigInt(Math.floor(amt * 1_000_000))
    // deposit(uint64) selector = 0x13765838
    const data = '0x13765838'
      + raw.toString(16).padStart(64, '0')

    try {
      print(`deposit ${amt} mUSDC (${raw} raw)`, 'info')
      print(`  from: ${account}`, 'info')
      print(`  to:   ${VAULT}`, 'info')
      print(`  data: ${data.slice(0,20)}...`, 'info')
      const txHash = await getEth().request({
        method: 'eth_sendTransaction',
        params: [{ from: account, to: VAULT, data, gas: '0x7a120' }]
      })
      print(`deposit tx sent: ${txHash}`, 'ok')
      const r = await waitReceipt(txHash)
      print(`deposit CONFIRMED in block ${parseInt(r.blockNumber, 16)}`, 'ok')
    } catch(e) {
      print(`deposit error: ${e.message} (code ${e.code})`, 'err')
      console.error(e)
    }
  }

  document.getElementById('btnBoth').onclick = async () => {
    clear()
    const amt = Number(document.getElementById('amount').value)
    if (!amt || !account) return
    const raw = BigInt(Math.floor(amt * 1_000_000))

    const approveData = '0x095ea7b3'
      + VAULT.slice(2).toLowerCase().padStart(64, '0')
      + raw.toString(16).padStart(64, '0')
    // deposit(uint64) selector = 0x13765838
    const depositData = '0x13765838'
      + raw.toString(16).padStart(64, '0')

    try {
      print(`[1/2] approve ${amt} mUSDC — confirm in MetaMask...`, 'info')
      const approveTxHash = await sendTx({ from: account, to: TOKEN, data: approveData, gas: '0x186a0' })
      if (approveTxHash) {
        const r = await waitReceipt(approveTxHash)
        print(`approve CONFIRMED in block ${parseInt(r.blockNumber, 16)}`, 'ok')
      }
      print(`approve done ✓`, 'ok')

      print(`[2/2] deposit ${amt} mUSDC — confirm in MetaMask...`, 'info')
      const depositTxHash = await sendTx({ from: account, to: VAULT, data: depositData, gas: '0x7a120' })
      if (depositTxHash) {
        const r = await waitReceipt(depositTxHash)
        print(`deposit CONFIRMED in block ${parseInt(r.blockNumber, 16)}`, 'ok')
      }
      print(`deposit done ✓`, 'ok')

      print(`\n🎉 FULL DEPOSIT COMPLETE!`, 'ok')
    } catch(e) {
      print(`error: ${e.message} (code ${e.code})`, 'err')
      console.error(e)
    }
  }
</script>
</body>
</html>
